<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32"
      href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="styles/style.css">

    <title>Time tracking dashboard</title>
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="profile">
          <img src="images/image-jeremy.png" alt="jeremy">
          <p class="report-text">Report for</p>
          <p class="name">Jeremy <br> Robson</p>
        </div>
        <div class="times">
          <p>Daily</p>
          <p>Weekly</p>
          <p>Monthly</p>
        </div>
      </div>
      <div class="tracks">
        <div class="track-item">
          <div class="nav">
            <span>Work</span>
            <span>...</span>
          </div>
          <p class="time">32hrs</p>
          <p class="previous">Last week - 36 hrs</p>
        </div>
        <div class="track-item">
          <div class="nav">
            <span>Work</span>
            <span>...</span>
          </div>
          <p class="time">32hrs</p>
          <p class="previous">Last week - 36 hrs</p>
        </div>
        <div class="track-item">
          <div class="nav">
            <span>Work</span>
            <span>...</span>
          </div>
          <p class="time">32hrs</p>
          <p class="previous">Last week - 36 hrs</p>
        </div>
        <div class="track-item">
          <div class="nav">
            <span>Work</span>
            <span>...</span>
          </div>
          <p class="time">32hrs</p>
          <p class="previous">Last week - 36 hrs</p>
        </div>
        <div class="track-item">
          <div class="nav">
            <span>Work</span>
            <span>...</span>
          </div>
          <p class="time">32hrs</p>
          <p class="previous">Last week - 36 hrs</p>
        </div>
        <div class="track-item">
          <div class="nav">
            <span>Work</span>
            <span>...</span>
          </div>
          <p class="time">32hrs</p>
          <p class="previous">Last week - 36 hrs</p>
        </div>
      </div>
    </div>
  </body>
</html>
